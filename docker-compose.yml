# App only — MySQL comes from Dokploy Database service (same pattern as habit-hero).
# Do NOT publish host :3000 (habit-hero already uses it). Traefik uses expose.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_GITHUB_ID=${AUTH_GITHUB_ID}
      - AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET}
      - AUTH_URL=${AUTH_URL}
      - NODE_ENV=production
      - PORT=3000
